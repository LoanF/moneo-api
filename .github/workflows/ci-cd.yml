name: CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Vérification & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: moneo_test
          POSTGRES_PASSWORD: moneo_test
          POSTGRES_DB: moneo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneo_test -d moneo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: moneo_test
      POSTGRES_PASSWORD: moneo_test
      POSTGRES_DB: moneo_test
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérification TypeScript
        run: pnpm exec tsc --noEmit

      - name: Tests unitaires avec couverture
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true

  version_bump:
    name: Mise à jour de la version & changelog
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v5

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Configuration Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version & Generate Changelog
        run: |
          pnpm exec standard-version --commit-all -m "chore(release): %s [skip ci]"

      - name: Get version from package.json
        id: pkg
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Push changes and tags
        run: git push --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.VERSION }}
          name: Release v${{ steps.pkg.outputs.VERSION }}
          body_path: CHANGELOG.md
          generate_release_notes: true

  deploy:
    name: Déploiement
    needs: version_bump
    runs-on: self-hosted
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Pull latest changes (with new version)
        run: git pull origin master

      - name: Create .env file from Secrets
        run: |
          cat <<EOF > .env
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          DB_HOST=db
          ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}
          BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
          FIREBASE_SERVICE_ACCOUNT='${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          EOF

      - name: Déployer avec Docker Compose
        run: |
          docker compose up -d --build
          docker compose ps
          docker image prune -f

      - name: Appliquer les migrations
        run: docker compose exec -T api npx sequelize-cli db:migrate