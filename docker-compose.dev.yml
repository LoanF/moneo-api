# Usage local uniquement, en plus du compose de base :
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Bascule le service api sur le stage "development" du Dockerfile (hot-reload
# via tsx watch, inspecteur Node exposé). Jamais utilisé en déploiement : la
# CI n'appelle que "docker compose up", sans -f, donc ce fichier n'a aucun
# effet sur le serveur.
services:
  api:
    build:
      target: development
    command: pnpm run dev
    ports:
      - "9229:9229"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
